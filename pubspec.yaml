name: mushaf
description: "مصحف إلكتروني برواية حفص - نص وخط مجمع الملك فهد لطباعة المصحف الشريف"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/tafsir/
  fonts:
    - family: KfgqpcHafs
      fonts:
        - asset: assets/fonts/kfgqpc_hafs.ttf
